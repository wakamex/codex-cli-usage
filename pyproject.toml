[project]
name = "codex-cli-usage"
version = "0.1.7"
description = "Codex CLI usage monitor — fetches rate limits from OpenAI's ChatGPT backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_cli_usage"]

[project.urls]
Homepage = "https://github.com/wakamex/codex-cli-usage"
Source = "https://github.com/wakamex/codex-cli-usage"

[project.scripts]
codex-cli-usage = "codex_cli_usage:main"
